name: 自动构建发布二进制

# 触发条件：推送 main 分支、推送 v* 标签、手动触发
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 创建 GitHub Release / 上传资产需要 contents 写权限
permissions:
  contents: write

jobs:
  build:
    name: 构建并发布二进制
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go 工具链
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        working-directory: frontend
        run: pnpm build

      - name: 复制前端产物到后端内嵌目录
        run: |
          rm -rf backend/cmd/server/webdist
          mkdir -p backend/cmd/server/webdist
          cp -r frontend/dist/. backend/cmd/server/webdist/

      - name: 运行后端测试
        working-directory: backend
        run: go test ./... -count=1

      - name: 构建二进制（单文件，内嵌前端）
        working-directory: backend
        run: go build -trimpath -ldflags "-s -w" -o ../bin/ledger ./cmd/server

      - name: 生成校验和
        working-directory: bin
        run: sha256sum ledger > ledger.sha256

      - name: 上传构建产物（工作流页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: ledger-linux-amd64
          path: |
            bin/ledger
            bin/ledger.sha256
          if-no-files-found: error

      - name: 发布 GitHub Release（仅打标签时）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            bin/ledger bin/ledger.sha256 \
            --repo "${{ github.repository }}" \
            --title "发布 ${GITHUB_REF_NAME}" \
            --notes "由「自动构建发布二进制」工作流自动构建的 Linux amd64 单文件二进制（内嵌前端页面）。
            运行：chmod +x ledger && ./ledger，然后访问 http://127.0.0.1:8080"
